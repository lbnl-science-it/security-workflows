name: Security Scan and SecObserve Upload

permissions:
  contents: read
on:
  workflow_call:
    inputs:
      fetch_depth:
        description: 'Number of commits to fetch (0 for all history)'
        required: false
        default: '1'
        type: string
    # Declared so callers can pass this one secret by name instead of
    # `secrets: inherit`, which hands a third-party-callable reusable workflow
    # every secret the calling repository holds (CWE-250). This is the only
    # secret the workflow reads; SO_API_BASE_URL is a `vars` entry, which a
    # called workflow resolves from the caller's own repository and org without
    # being passed.
    secrets:
      SO_API_TOKEN:
        description: 'SecObserve API token used to upload observations'
        required: true

# `so_origin_docker_image_name_tag` is deliberately not set on any importer call
# below. It used to carry `${{ github.sha }}`, and that is what an observation's
# identity is built from, so every commit minted a new identity for the same
# finding: the importer resolved the row a reviewer had assessed and inserted an
# identical `Open` one beside it. A `False positive` dismissal therefore survived
# only until the next push, and each commit left a full generation of rows behind
# (measured 2026-08-14: 225 rows for 45 findings over five scans).
#
# The field means *container image tag*. Nothing in this repository reads it, the
# importer action declares it `required: false`, and the commit SHA is already in
# the artifact filenames where traceability actually wants it. Resolution scope
# does not include it either — a scan whose SHA differed still resolved the
# previous generation — so removing it is self-healing: the next scan of each
# repository closes its stale rows, and every scan after that updates in place.
# See docs/scanning.md, "How a finding disappears".
env:
  WORKFLOW_VERSION: "1.19.0"
  # Pin Docker images by digest for reproducibility (avoid floating monthly tags).
  # secobserve-scanners:2026_07 amd64 digest (also carries gitleaks and trivy config).
  # It bundles gitleaks 8.30.1 (unchanged from 2026_04), trivy 0.72.0 and semgrep
  # 1.170.0 -- so a bump here moves three scanners at once, and the versions are
  # named because nothing else in this file records them. 2026_05 was never
  # published and 2026_06 is deliberately skipped: it pairs Alpine 3.24.0 (musl
  # 1.2.6) with semgrep 1.166.0, and semgrep 1.170.0 is the release that fixes
  # `Fatal error: Failed to allocate signal stack for domain 0` on musl 1.2.6.
  # 2026_04 was safe from that only because it is still Alpine 3.23.4:
  SO_SCANNERS_IMAGE: 'ghcr.io/secobserve/secobserve-scanners@sha256:d1f28acb381dd7e5664f588d5c7343df06aa51020f850ba3b907504e9d23769e'
  # osv-scanner v2.3.8 amd64 digest. Deliberately NOT moved with the others: 2.5.0
  # migrated scanning, filtering and matching onto the osv-scalibr pipeline, and
  # both this repository's OSV contracts are observations of the old one -- the
  # exit-code set 0/1/128 below, and the `Error during extraction` stderr string
  # the partial-coverage sentinel greps for. Bumping needs those re-verified:
  OSV_SCANNER_IMAGE: 'ghcr.io/google/osv-scanner@sha256:904f48030672996473eda96b9193a090c0b2096b0d45b63e51b19b34533b7171'
  # trufflehog 3.97.0 multi-arch digest (official image; the secobserve-scanners
  # image has no trufflehog binary). The tag carries no `v` prefix -- `:v3.97.0`
  # does not exist. 3.95.6 is why this moved: a line longer than bufio's 64 KB
  # token limit was skipped outright, so a secret on one long line (minified JS, a
  # single-line .env) was never scanned:
  TRUFFLEHOG_IMAGE: 'ghcr.io/trufflesecurity/trufflehog@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33'
  # zizmor 1.29.0 multi-arch digest. The tag carries no `v` prefix -- `:v1.29.0`
  # does not exist -- so the digest is the only safe reference anyway:
  ZIZMOR_IMAGE: 'ghcr.io/zizmorcore/zizmor@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284'

jobs:
  security_scan:
    runs-on: arc-runner-set
    # Both secret scanners run on every branch: Gitleaks reads the checked-out
    # working tree and TruffleHog reads the full git history, and neither covers
    # the other's ground. The heavier scanners (Trivy filesystem, Trivy config,
    # OSV-Scanner, Semgrep, zizmor) and the security gate only run on the
    # privileged branch set (default branch, main, master, dev, sec) or a manual
    # dispatch.
    env:
      FULL_SCAN: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch || contains(fromJSON('["main","master","dev","sec"]'), github.ref_name) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth || 1 }}

      # 1. Run Gitleaks for pattern-matched secrets in the working tree (runs on
      #    every branch). It complements TruffleHog rather than duplicating it:
      #    this entrypoint passes --no-git, so Gitleaks reads the checked-out tree
      #    and reports unverified pattern and entropy matches, while TruffleHog
      #    reads the full history and reports only credentials it could
      #    authenticate. Neither finds what the other does.
      #
      #    It runs BEFORE TruffleHog deliberately. On this surface the workspace
      #    is the checkout, so anything an earlier step writes there is inside the
      #    tree Gitleaks reads -- and trufflehog.json quotes every verified secret
      #    in plaintext (Raw/RawV2). Running first is what keeps the pipeline's own
      #    output out of the scan.
      #
      #    --source is NOT optional, and this is the one wiring detail to get
      #    right. Every other entrypoint in this image ends with "$TARGET";
      #    entrypoint_gitleaks.sh echoes TARGET and never passes it, so
      #    `gitleaks detect` scans its current working directory -- $RUN_DIRECTORY,
      #    which is where the reports go. Measured 2026-08-14 against this digest
      #    on a fixture holding an AWS secret key, a database password and an RSA
      #    private key: wired the way Trivy is wired, with the reports directory
      #    disjoint from the checkout, it wrote a well-formed zero-finding secrets
      #    SARIF at exit 0. Passing --source <checkout> found 2 of the 3.
      #    --redact is already passed by the entrypoint, so no raw credential value
      #    reaches SecObserve evidence and the SARIF is safe as a build artifact
      #    (verified in the same runs: none of the three planted secrets appears in
      #    it). FURTHER_PARAMETERS is interpolated BEFORE the entrypoint's own
      #    --redact and --redact takes an optional percentage, so nothing added
      #    here may carry a --redact of its own.
      #
      #    Fail closed: the entrypoint passes --exit-code 0, so findings never move
      #    the exit status and the success set is {0} only -- a non-zero code can
      #    only mean it did not run. There is no sentinel, for the same reason
      #    Trivy and Semgrep have none: the report is written by the entrypoint, so
      #    a failure means there is no report to upload and this step fails the job.
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -e GITHUB_WORKSPACE=/src \
            -e RUN_DIRECTORY=/src \
            -e TARGET=/src \
            -e REPORT_NAME=gitleaks.sarif \
            -e FURTHER_PARAMETERS='--source /src' \
            -e SO_UPLOAD=false \
            --entrypoint /entrypoints/entrypoint_gitleaks.sh \
            "$SO_SCANNERS_IMAGE"

      - name: Upload Gitleaks to SecObserve
        uses: lbnl-science-it/security-workflows/.github/actions/importer@3d796045e23440d4d09a5961f37497361798db07 # published main, 2026-07-31
        with:
          so_file_name: 'gitleaks.sarif'
          so_parser_name: 'SARIF'
          so_api_base_url: ${{ vars.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: ${{ github.event.repository.name }}
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: git-scan

      # 2. Run TruffleHog for verified secrets (runs on every branch).
      #    SecObserve has no TruffleHog parser and the secobserve-scanners image
      #    has no trufflehog binary, so we run the official image, convert its
      #    JSON to SARIF, and import via the SARIF parser. The converter is
      #    inlined (not a checked-out script) because this reusable workflow runs
      #    against the *caller's* checkout, which does not contain our scripts.
      #    Verified findings -> SARIF level "error" -> SecObserve HIGH severity.
      #    Fail closed: TruffleHog exits 0 with or without findings (we do not
      #    pass --fail, which exits 183 on findings), so any non-zero exit --
      #    docker daemon/pull failures (125), a non-runnable or missing command
      #    (126/127), kills such as 137 (OOM) -- means the scan DID NOT RUN.
      #    Record it and continue: the convert step uploads a sentinel finding
      #    in the scan's place, the remaining scanners still run, and the final
      #    "Enforce scanner status" step turns the job red.
      - name: Run TruffleHog
        id: trufflehog_scan
        run: |
          STATUS=0
          # --network host is what makes this scanner work at all here, and it is
          # not a preference. `--results=verified` reports only credentials it can
          # authenticate, which means an outbound call per candidate. On the
          # default bridge network of this runner's dind daemon those calls go
          # nowhere — measured 2026-08-15 against the standing fixture, same
          # command and same repository: bridge `"verified_secrets":0`, host
          # network `"verified_secrets":1`. So every GitHub-Actions scan in the
          # estate reported zero secrets whatever the repository contained, and a
          # scan that *cannot* find secrets is indistinguishable from a clean one
          # unless you read `verification_caching.Misses`, which counts detectors
          # that fired and were never checked.
          #
          # In this dind setup `--network host` is the *Pod's* namespace, which
          # the runner container shares and which does have egress. It widens
          # nothing that matters: the Pod already runs a privileged docker:dind
          # sidecar with the socket mounted, so a scanner container is not what
          # bounds this Pod.
          docker run --rm --network host -v "$GITHUB_WORKSPACE":/repo "$TRUFFLEHOG_IMAGE" \
            git file:///repo --results=verified --json --no-update > trufflehog.json || STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "scanner_failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::TruffleHog did not run: docker exit code $STATUS"
          fi

      - name: Convert TruffleHog Report to SARIF
        env:
          TRUFFLEHOG_EXIT_CODE: ${{ steps.trufflehog_scan.outputs.exit_code }}
        run: |
          # On the failure path, write the scanner-execution-failure sentinel
          # (one "scanner-execution-failure" result at level "error" under the
          # same TruffleHog tool driver) instead of converting crash output into
          # a clean zero-finding SARIF. Keep behaviorally consistent with
          # .github/scripts/scanner_failure_sarif.py in the git-scan repository.
          # Both message.text and the rule shortDescription.text carry the
          # pinned "Scanner execution failure:" prefix so the SecObserve
          # observation title starts with it whichever field SecObserve titles
          # from; Insights matches the failure by that title prefix.
          if [ "$TRUFFLEHOG_EXIT_CODE" != "0" ]; then
            printf '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"TruffleHog","informationUri":"https://github.com/trufflesecurity/trufflehog","version":"3.95.5","rules":[{"id":"scanner-execution-failure","name":"Scanner execution failure: TruffleHog did not run","shortDescription":{"text":"Scanner execution failure: TruffleHog did not run"},"helpUri":"https://github.com/trufflesecurity/trufflehog"}]}},"results":[{"ruleId":"scanner-execution-failure","level":"error","message":{"text":"Scanner execution failure: TruffleHog did not run: docker exit code %s. This is a scan-execution failure, not a finding in the scanned code: the scanner crashed or could not start, so this scan produced no results and cannot prove the target is clean."},"partialFingerprints":{"scannerExecutionFailure/v1":"TruffleHog"}}]}]}\n' "$TRUFFLEHOG_EXIT_CODE" > trufflehog.sarif
            echo "Wrote scanner-execution-failure sentinel to trufflehog.sarif"
            exit 0
          fi
          python3 - trufflehog.json trufflehog.sarif --tool-version 3.97.0 <<'PY'
          # BEGIN GENERATED: .github/scripts/trufflehog_to_sarif.py
          #!/usr/bin/env python3
          """Convert TruffleHog JSON output into SARIF 2.1.0 for SecObserve.

          SecObserve has no TruffleHog parser, but it does have a SARIF parser. This script
          bridges the gap: it reads TruffleHog's newline-delimited JSON (one finding per
          line, as produced by `trufflehog ... --json`) and writes a SARIF report that
          SecObserve's SARIF parser accepts.

          TruffleHog gained a native `--sarif` output in 3.97.0, and we deliberately do not
          use it. Two reasons, both about what SecObserve does with the document rather than
          about the document being wrong:

            - Its tool driver name is lowercase `trufflehog`. SecObserve takes the scanner
              identifier straight from the SARIF driver name, and `VERIFIED_SECRET_SCANNERS`
              in `apps/insights-api/src/read-model.ts` is `['TruffleHog']` — so switching
              would drop every verified secret out of the verified partition, zero
              `secrets_verified`, and stop the `urgent` tier firing, with no error anywhere.
              That failure has happened once already, over gitleaks' casing.
            - Its message is `"Found verified result for detector X."` and carries no
              redacted match, commit or author. Ours carries all three, which is the triage
              detail a reviewer opens the finding for — and changing the message re-identifies
              every existing observation, splitting assessed rows from new Open ones.

          Upstream is clean on the axis that matters most: it emits no raw secret either,
          only a SHA-256 of it in the fingerprint. Adopting it is a decision about scanner
          identity and observation identity, not a drop-in — see docs/scanning.md.

          Severity mapping (SecObserve SARIF parser): SARIF `level` "error" -> HIGH,
          "warning" -> MEDIUM. We run TruffleHog with --results=verified, so every finding
          is a live, confirmed secret and is emitted as "error" (HIGH).

          If the input is missing, empty, or contains no findings, a valid empty SARIF
          envelope is written so SecObserve never rejects an empty file (mirrors how the
          OSV-Scanner step handles a no-vulnerabilities run).
          """

          import argparse
          import json
          import sys

          # Matches the $schema used by the OSV-Scanner empty envelope elsewhere in these
          # workflows. SecObserve's check_format() only requires "sarif" in the $schema and
          # version == "2.1.0".
          SARIF_SCHEMA = (
              "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/"
              "sarif-2.1/schema/sarif-schema-2.1.0.json"
          )
          TOOL_NAME = "TruffleHog"
          TOOL_URI = "https://github.com/trufflesecurity/trufflehog"


          def _iter_findings(path):
              """Yield TruffleHog finding dicts from an NDJSON file.

              Tolerant of: a missing/empty file, blank lines, non-JSON banner lines, and
              log/stats objects that lack SourceMetadata. A finding is any JSON object that
              carries a "SourceMetadata" key.
              """
              try:
                  with open(path, "r", encoding="utf-8", errors="replace") as handle:
                      lines = handle.readlines()
              except FileNotFoundError:
                  return

              for line in lines:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      obj = json.loads(line)
                  except json.JSONDecodeError:
                      # TruffleHog sends logs to stderr, but stay defensive about stray
                      # non-JSON on stdout.
                      continue
                  if isinstance(obj, list):
                      for item in obj:
                          if isinstance(item, dict) and "SourceMetadata" in item:
                              yield item
                  elif isinstance(obj, dict) and "SourceMetadata" in obj:
                      yield obj


          def _source_data(finding):
              """Return the inner source dict (Git/Filesystem/Github/...) and its kind."""
              data = (finding.get("SourceMetadata") or {}).get("Data") or {}
              if not isinstance(data, dict):
                  return {}, ""
              for kind, value in data.items():
                  if isinstance(value, dict) and value:
                      return value, kind
              return {}, ""


          def _start_line(source):
              line = source.get("line")
              try:
                  line = int(line)
              except (TypeError, ValueError):
                  line = 0
              # SARIF requires startLine >= 1.
              return line if line >= 1 else 1


          def _result(finding):
              detector = finding.get("DetectorName") or "UnknownDetector"
              verified = bool(finding.get("Verified"))
              redacted = finding.get("Redacted") or ""
              decoder = finding.get("DecoderName") or ""
              source, kind = _source_data(finding)

              uri = source.get("file") or ""
              commit = source.get("commit") or ""

              message_parts = [
                  f"{detector} secret detected and {'verified' if verified else 'unverified'} by TruffleHog."
              ]
              if redacted:
                  message_parts.append(f"Redacted match: {redacted}")
              if commit:
                  message_parts.append(f"Commit: {commit}")
              if source.get("email"):
                  message_parts.append(f"Author: {source['email']}")
              if decoder and decoder.upper() != "PLAIN":
                  message_parts.append(f"Decoder: {decoder}")

              result = {
                  "ruleId": detector,
                  "level": "error" if verified else "warning",
                  "message": {"text": " ".join(message_parts)},
              }
              if uri:
                  result["locations"] = [
                      {
                          "physicalLocation": {
                              "artifactLocation": {"uri": uri},
                              "region": {"startLine": _start_line(source)},
                          }
                      }
                  ]
              # Stable-ish fingerprint to aid de-duplication across runs.
              fingerprint = "/".join(
                  [detector, kind, uri, commit, redacted, str(_start_line(source))]
              )
              result["partialFingerprints"] = {"truffleHogFinding/v1": fingerprint}
              return result, detector


          def build_sarif(findings, tool_version=None):
              results = []
              rules = {}
              for finding in findings:
                  result, detector = _result(finding)
                  results.append(result)
                  if detector not in rules:
                      rules[detector] = {
                          "id": detector,
                          "name": detector,
                          "shortDescription": {"text": f"{detector} secret detected by TruffleHog"},
                          "helpUri": TOOL_URI,
                      }

              driver = {
                  "name": TOOL_NAME,
                  "informationUri": TOOL_URI,
                  "rules": list(rules.values()),
              }
              if tool_version:
                  driver["version"] = tool_version

              return {
                  "$schema": SARIF_SCHEMA,
                  "version": "2.1.0",
                  "runs": [{"tool": {"driver": driver}, "results": results}],
              }


          def main(argv=None):
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("input", help="TruffleHog --json (NDJSON) report path")
              parser.add_argument("output", help="SARIF 2.1.0 output path")
              parser.add_argument(
                  "--tool-version", default=None, help="TruffleHog version to record in the SARIF tool driver"
              )
              args = parser.parse_args(argv)

              findings = list(_iter_findings(args.input))
              sarif = build_sarif(findings, tool_version=args.tool_version)

              with open(args.output, "w", encoding="utf-8") as handle:
                  json.dump(sarif, handle, indent=2)
                  handle.write("\n")

              print(f"Wrote {len(findings)} TruffleHog finding(s) to {args.output}")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          # END GENERATED: .github/scripts/trufflehog_to_sarif.py
          PY

      - name: Upload TruffleHog to SecObserve
        uses: lbnl-science-it/security-workflows/.github/actions/importer@3d796045e23440d4d09a5961f37497361798db07 # published main, 2026-07-31
        with:
          so_file_name: 'trufflehog.sarif'
          so_parser_name: 'SARIF'
          so_api_base_url: ${{ vars.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: ${{ github.event.repository.name }}
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: git-scan

      # 3. Run Trivy (local action pins secobserve-scanners image by digest)
      - name: Run Trivy Filesystem
        if: env.FULL_SCAN == 'true'
        uses: lbnl-science-it/security-workflows/.github/actions/trivy_filesystem@3d796045e23440d4d09a5961f37497361798db07 # published main, 2026-07-31
        with:
          target: '.'
          report_name: 'trivy.json'
          so_api_base_url: ${{ vars.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: ${{ github.event.repository.name }}
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: git-scan

      # 4. Run Trivy in config mode for infrastructure misconfiguration. Same
      #    image and same privileged-branch condition as Trivy filesystem, but a
      #    different entrypoint, a different parser and a different finding type:
      #    the filesystem scan uploads CycloneDX and classifies as `sca`, this one
      #    uploads SARIF and classifies as `sast`. Note both report under the SARIF
      #    tool driver name `Trivy` (verified 2026-08-14), so on the Observations
      #    list "which Trivy found this" is answerable only from the finding type.
      #    Covered definition types, read from --misconfig-scanners on this digest:
      #    azure-arm, cloudformation, dockerfile, helm, kubernetes, terraform,
      #    terraformplan, ansible. Docker Compose is NOT among them.
      #    --skip-version-check stops it contacting the Trivy release endpoint for
      #    a version notice; it does not self-update, and the misconfiguration
      #    checks fall back to the copies embedded in the image when the check
      #    bundle cannot be downloaded (verified: identical rule ids with
      #    --network none).
      #    Fail closed exactly like Trivy filesystem: the entrypoint passes
      #    --exit-code 0, so the success set is {0} only and a non-zero code can
      #    only mean it did not run. No sentinel -- the entrypoint writes the
      #    report, so a failure leaves nothing to upload and this step fails the job.
      - name: Run Trivy Config
        if: env.FULL_SCAN == 'true'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -e GITHUB_WORKSPACE=/src \
            -e RUN_DIRECTORY=/src \
            -e TARGET=/src \
            -e REPORT_NAME=trivy_config.sarif \
            -e FURTHER_PARAMETERS=--skip-version-check \
            -e SO_UPLOAD=false \
            --entrypoint /entrypoints/entrypoint_trivy_config.sh \
            "$SO_SCANNERS_IMAGE"

      - name: Upload Trivy Config to SecObserve
        if: env.FULL_SCAN == 'true'
        uses: lbnl-science-it/security-workflows/.github/actions/importer@3d796045e23440d4d09a5961f37497361798db07 # published main, 2026-07-31
        with:
          so_file_name: 'trivy_config.sarif'
          so_parser_name: 'SARIF'
          so_api_base_url: ${{ vars.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: ${{ github.event.repository.name }}
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: git-scan

      # 5. Run OSV-Scanner (pinned by image digest for total immutability).
      #    Fail closed: osv-scanner exit codes (verified against the pinned
      #    v2.3.8 image; https://google.github.io/osv-scanner/output/):
      #    0 = scanned, no findings; 1 = scanned, vulnerabilities found;
      #    128 = no package sources found. All three mean the scan RAN.
      #    Anything else (its reserved error codes, docker 125/126/127, kills
      #    such as 137) means it did not: record the failure and upload a
      #    sentinel finding instead of a clean empty envelope.
      - name: Generate OSV-Scanner Report
        id: osv_scan
        if: env.FULL_SCAN == 'true'
        run: |
          STATUS=0
          docker run --rm -v "$GITHUB_WORKSPACE":/src "$OSV_SCANNER_IMAGE" \
            scan \
            --format sarif \
            --recursive \
            /src > osv_scanner.sarif 2> osv_scanner.stderr || STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          # Keep the scanner's own diagnostics in the job log; the redirect above
          # is only so the extraction check below can read them.
          cat osv_scanner.stderr

          if [ "$STATUS" = "0" ] || [ "$STATUS" = "1" ] || [ "$STATUS" = "128" ]; then
            # The scan ran. OSV-Scanner writes nothing to stdout when it has no
            # findings, which leaves an empty file that SecObserve rejects.
            # Write a minimal valid SARIF envelope so the importer can process it.
            if [ ! -s osv_scanner.sarif ]; then
              echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"osv-scanner","informationUri":"https://github.com/google/osv-scanner","rules":[]}},"results":[]}]}' > osv_scanner.sarif
            fi
            # A manifest OSV-Scanner cannot parse is invisible to the exit code:
            # it prints "Error during extraction" and still exits successfully,
            # so a repository whose manifests do not parse gets a clean SCA
            # verdict on a green run. Append a sentinel BESIDE the real findings
            # rather than replacing them — the rest of the scan is valid — and
            # leave the run green on purpose: this is measuring how often it
            # happens before it is allowed to fail anything.
            # Keep behaviorally consistent with security_scan.yml and
            # adhoc_scan.yml.
            python3 - osv_scanner.sarif osv_scanner.stderr <<'EXTRACTION'
          import json, sys

          sarif_path, stderr_path = sys.argv[1], sys.argv[2]
          lines = [line.strip() for line in open(stderr_path, errors='replace')
                   if 'Error during extraction' in line]
          if not lines:
              raise SystemExit(0)

          with open(sarif_path) as handle:
              sarif = json.load(handle)

          detail = ' | '.join(lines[:5])
          if len(lines) > 5:
              detail += ' | and %d more' % (len(lines) - 5)

          # The "Scanner execution failure:" prefix is what SecObserve titles the
          # observation from and what AppSec Insights matches on. This is a
          # partial-coverage failure rather than a crash, and the title says so.
          rule = {
              'id': 'scanner-extraction-failure',
              'name': 'Scanner execution failure: OSV-Scanner could not read every manifest',
              'shortDescription': {'text': 'Scanner execution failure: OSV-Scanner could not read every manifest'},
              'helpUri': 'https://github.com/google/osv-scanner',
          }
          result = {
              'ruleId': 'scanner-extraction-failure',
              'level': 'error',
              'message': {'text':
                  'Scanner execution failure: OSV-Scanner could not read every manifest, so this '
                  'scan does not cover the whole dependency tree and cannot prove the target is '
                  'clean. OSV-Scanner reports these on stderr and exits successfully, which is why '
                  'the run is green. %d extraction error(s): %s' % (len(lines), detail)},
              'partialFingerprints': {'scannerExecutionFailure/v1': 'OSV-Scanner-extraction'},
          }

          runs = sarif.setdefault('runs', [])
          if not runs:
              runs.append({'tool': {'driver': {'name': 'osv-scanner',
                                               'informationUri': 'https://github.com/google/osv-scanner',
                                               'rules': []}},
                           'results': []})
          runs[0].setdefault('tool', {}).setdefault('driver', {}).setdefault('rules', []).append(rule)
          runs[0].setdefault('results', []).append(result)

          with open(sarif_path, 'w') as handle:
              json.dump(sarif, handle)
          print('Appended an extraction-failure sentinel (%d error(s)) to %s' % (len(lines), sarif_path))
          EXTRACTION
            if grep -q 'Error during extraction' osv_scanner.stderr; then
              echo "::warning::OSV-Scanner could not read every manifest; a sentinel was uploaded beside the results. The run stays green."
            fi
          else
            echo "scanner_failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::OSV-Scanner did not run: docker exit code $STATUS"
            # Sentinel: keep behaviorally consistent with
            # .github/scripts/scanner_failure_sarif.py in the git-scan repository.
            # Both message.text and shortDescription.text carry the pinned
            # "Scanner execution failure:" prefix (see the TruffleHog step).
            printf '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"osv-scanner","informationUri":"https://github.com/google/osv-scanner","rules":[{"id":"scanner-execution-failure","name":"Scanner execution failure: OSV-Scanner did not run","shortDescription":{"text":"Scanner execution failure: OSV-Scanner did not run"},"helpUri":"https://github.com/google/osv-scanner"}]}},"results":[{"ruleId":"scanner-execution-failure","level":"error","message":{"text":"Scanner execution failure: OSV-Scanner did not run: docker exit code %s. This is a scan-execution failure, not a finding in the scanned code: the scanner crashed or could not start, so this scan produced no results and cannot prove the target is clean."},"partialFingerprints":{"scannerExecutionFailure/v1":"OSV-Scanner"}}]}]}\n' "$STATUS" > osv_scanner.sarif
          fi

      - name: Upload OSV-Scanner to SecObserve
        if: env.FULL_SCAN == 'true'
        uses: lbnl-science-it/security-workflows/.github/actions/importer@3d796045e23440d4d09a5961f37497361798db07 # published main, 2026-07-31
        with:
          so_file_name: 'osv_scanner.sarif'
          so_parser_name: 'SARIF'
          so_api_base_url: ${{ vars.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: ${{ github.event.repository.name }}
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: git-scan

      # 6. Run Semgrep (local action pins secobserve-scanners image by digest).
      #    CONFIGURATION stays p/default and the extra packs arrive through
      #    further_parameters, which the entrypoint interpolates unquoted and
      #    before its own --config -- repeated --config is valid, so widening the
      #    rule set needs no entrypoint change and no new image. Measured
      #    2026-08-14 end to end through the entrypoint on the pinned digest:
      #    exit 0, rules loaded 1074 -> 1144, and the SARIF tool driver name is
      #    still `Semgrep OSS`, which both the read-model and the secret filter
      #    below key on. p/security-audit is deliberately NOT here: it added 13
      #    rules of near-total overlap, and each --config is a registry fetch on
      #    every scan.
      - name: Run Semgrep
        if: env.FULL_SCAN == 'true'
        uses: lbnl-science-it/security-workflows/.github/actions/semgrep@3d796045e23440d4d09a5961f37497361798db07 # published main, 2026-07-31
        with:
          target: '.'
          configuration: 'p/default'
          further_parameters: '--config p/python --config p/owasp-top-ten'
          report_name: 'semgrep.json'
          so_upload: 'false'
          so_api_base_url: ${{ vars.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: ${{ github.event.repository.name }}
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: git-scan

      # Semgrep's p/default pack includes the `generic.secrets.*` rules, whose
      # whole job is matching credential *values* — and SecObserve stores the
      # matched snippet as evidence, so an uploaded hit puts the raw value in the
      # findings database. TruffleHog is this pipeline's secret scanner and it
      # verifies before reporting; Semgrep's shape-matches are dropped instead.
      #
      # Two defects this step used to have, both worth not reintroducing:
      #   - It rewrote semgrep.json in place. The Semgrep action is a *docker*
      #     action, so its report is owned by root while `run:` steps execute as
      #     the runner user: every scan died on
      #     `PermissionError: [Errno 13] Permission denied: 'semgrep.json'`,
      #     which fails closed but also means the filter never actually ran. The
      #     filtered report is now a new file the runner owns.
      #   - It matched the substrings `secret`, `api-key`, `private-key` … against
      #     the rule id, which is both too wide and too narrow: it would have
      #     dropped real SAST findings such as
      #     `yaml.github-actions.security.secrets-inherit` while keeping
      #     `detected-aws-access-key-id-value`, which carries an actual key. The
      #     rule id's *namespace* is the thing that identifies the secrets pack.
      - name: Filter Semgrep Report
        id: filter_semgrep
        if: env.FULL_SCAN == 'true' && always()
        run: |
          if [ ! -f semgrep.json ]; then
            echo "No semgrep.json to filter."
            exit 0
          fi
          rm -f semgrep_filtered.json
          python3 - semgrep.json semgrep_filtered.json <<'FILTER'
          import json, sys

          # Semgrep registry ids are `<namespace>.<path>.<rule>.<rule>`; every
          # rule whose purpose is matching a credential value lives here.
          SECRETS_NAMESPACE = "generic.secrets."

          source_path, target_path = sys.argv[1], sys.argv[2]
          with open(source_path, encoding="utf-8") as handle:
              report = json.load(handle)

          def keep(rule_id):
              return not str(rule_id or "").startswith(SECRETS_NAMESPACE)

          removed = 0
          if isinstance(report, dict) and isinstance(report.get("runs"), list):
              # SARIF, which is what this pipeline uploads.
              for run in report["runs"]:
                  results = run.get("results")
                  if not isinstance(results, list):
                      continue
                  kept = [r for r in results if keep(r.get("ruleId"))]
                  removed += len(results) - len(kept)
                  run["results"] = kept
          elif isinstance(report, dict) and isinstance(report.get("results"), list):
              # Semgrep's native JSON, in case the scanner image stops emitting SARIF.
              results = report["results"]
              kept = [r for r in results if keep(r.get("check_id"))]
              removed += len(results) - len(kept)
              report["results"] = kept
          else:
              raise SystemExit(
                  "semgrep.json has neither SARIF runs nor native results; refusing to "
                  "upload a report this step cannot filter"
              )

          with open(target_path, "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=2)
              handle.write("\n")

          print("Removed %d %s* result(s); wrote %s" % (removed, SECRETS_NAMESPACE, target_path))
          FILTER

      - name: Upload Semgrep to SecObserve
        if: env.FULL_SCAN == 'true' && always() && steps.filter_semgrep.outcome == 'success' && hashFiles('semgrep_filtered.json') != ''
        uses: lbnl-science-it/security-workflows/.github/actions/importer@3d796045e23440d4d09a5961f37497361798db07 # published main, 2026-07-31
        with:
          so_file_name: 'semgrep_filtered.json'
          so_parser_name: 'SARIF'
          so_api_base_url: ${{ vars.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: ${{ github.event.repository.name }}
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: git-scan

      # 7. Run zizmor to audit this repository's own GitHub Actions workflows
      #    (script injection, over-broad credential persistence, cache poisoning,
      #    unpinned actions). It is invoked directly rather than through a
      #    secobserve-scanners entrypoint, so it carries the full mark-and-continue
      #    plus sentinel treatment, exactly like OSV-Scanner above.
      #
      #    Fail closed, with a success set of TWO codes, verified 2026-08-14 against
      #    the pinned digest: 0 = audited; 3 = `no inputs collected`, which is what
      #    a repository with no .github/workflows exits and is a normal outcome, not
      #    a failure. Everything else means it did not run: 1 is a real error
      #    (including the online-audit failure below) and 2 is a usage error.
      #
      #    On exit 3 it emits ZERO BYTES -- not an empty SARIF -- so the envelope is
      #    synthesized here, or the importer rejects the upload with
      #    `400 ... file is empty`, the same trap the OSV-Scanner step guards.
      #
      #    --offline is mandatory, not a preference, and is the same class of
      #    supply-chain control as TruffleHog's --no-update: with GH_TOKEN or
      #    GITHUB_TOKEN in the environment zizmor switches to online audits and
      #    exits 1 when it cannot reach the network, and GITHUB_TOKEN is routinely
      #    present on the Actions path. --no-exit-codes keeps findings from moving
      #    the status (verified: findings still exit 0), which is what lets the
      #    success set stay this small. SARIF goes to stdout only -- note `-o` is
      #    the short form of --offline, NOT --output, so `-o report.sarif`
      #    misparses into a flag and a stray path.
      - name: Generate zizmor Report
        id: zizmor_scan
        if: env.FULL_SCAN == 'true'
        run: |
          STATUS=0
          docker run --rm -v "$GITHUB_WORKSPACE":/src "$ZIZMOR_IMAGE" \
            --format=sarif \
            --offline \
            --no-exit-codes \
            /src > zizmor.sarif || STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "0" ] || [ "$STATUS" = "3" ]; then
            # The audit ran. Exit 3 ("no inputs collected") writes nothing at all,
            # which SecObserve rejects as an empty file, so write a minimal valid
            # SARIF envelope under zizmor's own tool driver name.
            if [ ! -s zizmor.sarif ]; then
              echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"zizmor","informationUri":"https://docs.zizmor.sh","version":"1.29.0","rules":[]}},"results":[]}]}' > zizmor.sarif
            fi
          else
            echo "scanner_failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::zizmor did not run: docker exit code $STATUS"
            # Sentinel: keep behaviorally consistent with
            # .github/scripts/scanner_failure_sarif.py in the git-scan repository.
            # The rule's name, its shortDescription.text and message.text all carry
            # the pinned "Scanner execution failure:" prefix. `name` is the field
            # SecObserve titles the observation from -- measured 2026-08-13, and
            # getting it wrong once made every scanner failure invisible to the
            # `title LIKE 'Scanner execution failure:%'` predicate Insights uses.
            printf '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"zizmor","informationUri":"https://docs.zizmor.sh","version":"1.29.0","rules":[{"id":"scanner-execution-failure","name":"Scanner execution failure: zizmor did not run","shortDescription":{"text":"Scanner execution failure: zizmor did not run"},"helpUri":"https://docs.zizmor.sh"}]}},"results":[{"ruleId":"scanner-execution-failure","level":"error","message":{"text":"Scanner execution failure: zizmor did not run: docker exit code %s. This is a scan-execution failure, not a finding in the scanned code: the scanner crashed or could not start, so this scan produced no results and cannot prove the target is clean."},"partialFingerprints":{"scannerExecutionFailure/v1":"zizmor"}}]}]}\n' "$STATUS" > zizmor.sarif
          fi

      - name: Upload zizmor to SecObserve
        if: env.FULL_SCAN == 'true'
        uses: lbnl-science-it/security-workflows/.github/actions/importer@3d796045e23440d4d09a5961f37497361798db07 # published main, 2026-07-31
        with:
          so_file_name: 'zizmor.sarif'
          so_parser_name: 'SARIF'
          so_api_base_url: ${{ vars.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: ${{ github.event.repository.name }}
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: git-scan

      # 8. Check SecObserve security gate (local action pins secobserve-scanners image by digest)
      - name: Check Security Gate
        if: env.FULL_SCAN == 'true'
        uses: lbnl-science-it/security-workflows/.github/actions/check_security_gate@3d796045e23440d4d09a5961f37497361798db07 # published main, 2026-07-31
        with:
          so_api_base_url: ${{ vars.SO_API_BASE_URL }}
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: ${{ github.event.repository.name }}

      # 9. Upload Artifacts (filenames contain the commit SHA for traceability).
      #    trufflehog.json is deliberately NOT here: the raw NDJSON carries each
      #    verified secret in plaintext (Raw/RawV2), so it stays on the runner's
      #    disk as the converter's input only. The SARIF is the redacted form.
      #    semgrep.json is out for the same reason — it is the unfiltered report,
      #    whose `generic.secrets.*` hits quote the matched credential. Only the
      #    filtered copy travels.
      #    gitleaks.sarif IS here: the entrypoint passes --redact, so the report
      #    carries no credential value (verified against a fixture of three planted
      #    secrets, none of which appears in it).
      - name: Upload Artifacts
        if: always() && steps.filter_semgrep.outcome != 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            gitleaks.sarif
            trufflehog.sarif
            trivy.json
            trivy_config.sarif
            osv_scanner.sarif
            semgrep_filtered.json
            zizmor.sarif

      # 10. Fail the job if any scanner did not run. Each failure was recorded
      #    when it happened and a scanner-execution-failure sentinel was
      #    uploaded to SecObserve in the scan's place, so the other scanners
      #    still ran and the data says why this run is red. (A step skipped by
      #    FULL_SCAN leaves its outputs empty and is not a failure.)
      #    Only the directly-invoked scanners are checked here, because only they
      #    mark-and-continue: Gitleaks, Trivy filesystem, Trivy config and Semgrep
      #    are driven by the scanners image's own `set -e` entrypoints, so a failure
      #    there fails its own step and there is no report to upload. Every conjunct
      #    added below must stay -- a missing one is the fail-open case, a scanner
      #    that did not run while the job still reports success.
      - name: Enforce scanner status
        if: always()
        env:
          TRUFFLEHOG_FAILED: ${{ steps.trufflehog_scan.outputs.scanner_failed }}
          TRUFFLEHOG_EXIT_CODE: ${{ steps.trufflehog_scan.outputs.exit_code }}
          OSV_FAILED: ${{ steps.osv_scan.outputs.scanner_failed }}
          OSV_EXIT_CODE: ${{ steps.osv_scan.outputs.exit_code }}
          ZIZMOR_FAILED: ${{ steps.zizmor_scan.outputs.scanner_failed }}
          ZIZMOR_EXIT_CODE: ${{ steps.zizmor_scan.outputs.exit_code }}
        run: |
          FAILED=0
          if [ "$TRUFFLEHOG_FAILED" = "true" ]; then
            echo "::error::TruffleHog did not run (docker exit code $TRUFFLEHOG_EXIT_CODE); a sentinel finding was uploaded in its place"
            FAILED=1
          fi
          if [ "$OSV_FAILED" = "true" ]; then
            echo "::error::OSV-Scanner did not run (docker exit code $OSV_EXIT_CODE); a sentinel finding was uploaded in its place"
            FAILED=1
          fi
          if [ "$ZIZMOR_FAILED" = "true" ]; then
            echo "::error::zizmor did not run (docker exit code $ZIZMOR_EXIT_CODE); a sentinel finding was uploaded in its place"
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "A scanner that did not run is not a clean scan; failing the job."
            exit 1
          fi
          echo "All scanners ran."
